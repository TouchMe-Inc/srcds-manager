name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X 'main.version=${GITHUB_REF_NAME}'" \
            -o "dist/srcds-manager_linux_${GOARCH}" .

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srcds-manager_linux_${{ matrix.goarch }}
          path: dist/srcds-manager_linux_${{ matrix.goarch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true